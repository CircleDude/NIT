<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="CSS/style.css">
  <script src="../../../Библиотеки/d3.v7.min.js"></script>
  <script src="JavaScript/data.js"></script>
  <script src="JavaScript/main.js"></script>
  <script src="JavaScript/table.js"></script>
  <script src="JavaScript/chart.js"></script>
</head>
<body>

  <h3>Список самых высоких зданий</h3>

  <form id="setting">
    <p>
      <b>Значение по оси OX:</b><br>
      <input type="radio" id="radioCountry" name="OX_value" value="Страна" checked>
      <label for="radioCountry">Страна</label><br>
      <input type="radio" id="radioYear" name="OX_value" value="Год">
      <label for="radioYear">Год</label><br>
    </p>
    <p>
      <div id="titleOY"><b>Значение по оси OY:</b><br></div>
      <input type="checkbox" id="maxHeight">
      <label for="maxHeight">Максимальная высота</label><br>
      <input type="checkbox" id="minHeight">
      <label for="minHeight">Минимальная высота</label>
    </p>
    <p>
      Тип графика:
      <select id="graphType">
        <option value="dots">Точечная диаграмма</option>
        <option value="rects">Гисторамма</option>
      </select>
    </p>
    <input type="button" value="Построить" id="plotGraph">
  </form>

  <svg></svg>
  
  <input type="button" value="Скрыть таблицу" id="toggleTable">
  
  <table id="build"></table>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title> Трансформация и анимация</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="http://d3js.org/d3.v7.min.js"> </script>
    <script src="JavaScript/main.js"></script>
    <script src="JavaScript/image.js"></script>
    <script src="JavaScript/path.js"></script>
  </head>
  <body>

    <form id="setting">
      <div>
        <div id="scale">
          <p><b>Масштаб</b><br>
            <label for="sclx">по x: </label>
            <input type="number" id="sclx" value="1" max="600" min="0">
            <label for="sclx_finish">до</label>
            <input type="number" id="sclx_finish" value="3" max="600" min="0"><br>
            <label for="scly">по y: </label>
            <input type="number" id="scly" value="1" max="600" min="0">
            <label for="scly_finish">до</label>
            <input type="number" id="scly_finish" value="3" max="600" min="0">
          </p>
        </div>
        <div id="rotation">
          <p><b>Поворот</b><br>
            <label for="rot">угол (°): </label>
            <input type="number" id="rot" value="0" max="360" min="-360">
            <label for="rot_finish">до</label>
            <input type="number" id="rot_finish" value="180" max="360" min="-360"><br>
          </p>
        </div>
      </div>

      <label for="speed">Время анимации (мс):</label>
      <input type="number" id="speed" value="6000" max="100000" min="0"><br><br>

      <input type="button" value="Анимировать" id="animate">
      <input type="button" value="Очистить" id="clear"><br>
    </form>

    <svg></svg>

  </body>
</html>
